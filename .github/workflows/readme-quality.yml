name: README quality

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/validate-readme.mjs
      - .github/workflows/readme-quality.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - assets/**
      - scripts/validate-readme.mjs
      - .github/workflows/readme-quality.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate README assets
        run: node scripts/validate-readme.mjs
